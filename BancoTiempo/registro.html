<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Tiempo y Talento | Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="registro-container">

        <!-- ENCABEZADO -->
        <header class="registro-header">

            <div class="registro-logo">⌛</div>

            <h1>Banco de Tiempo</h1>
            <h2>Y TALENTO</h2>

            <p>¡Únete a nuestra comunidad!</p>

        </header>

        <!-- FORMULARIO -->
        <section class="registro-card">

            <div class="registro-titulo">
                <h2>Crear cuenta</h2>
                <p>Completa tus datos para formar parte de nuestra comunidad.</p>
            </div>

            <form>

                <div class="registro-campo">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario"
                    placeholder="Ej. Citlali123">
                </div>

                <div class="registro-dos-columnas">

                    <div class="registro-campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre"
                        placeholder="Tu nombre">
                    </div>

                    <div class="registro-campo">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido"
                        placeholder="Tu apellido">
                    </div>

                </div>

                <div class="registro-campo">
                    <label>Fecha de nacimiento</label>

                    <div class="fecha-nacimiento">

                        <select>
                            <option>Día</option>
                            <option>01</option>
                            <option>02</option>
                            <option>03</option>
                            <option>04</option>
                            <option>05</option>
                            <option>06</option>
                            <option>07</option>
                            <option>08</option>
                            <option>09</option>
                            <option>10</option>
                            <option>15</option>
                            <option>20</option>
                            <option>25</option>
                            <option>30</option>
                            <option>31</option>
                        </select>

                        <select>
                            <option>Mes</option>
                            <option>Enero</option>
                            <option>Febrero</option>
                            <option>Marzo</option>
                            <option>Abril</option>
                            <option>Mayo</option>
                            <option>Junio</option>
                            <option>Julio</option>
                            <option>Agosto</option>
                            <option>Septiembre</option>
                            <option>Octubre</option>
                            <option>Noviembre</option>
                            <option>Diciembre</option>
                        </select>

                        <select>
                            <option>Año</option>
                            <option>2000</option>
                            <option>2001</option>
                            <option>2002</option>
                            <option>2003</option>
                            <option>2004</option>
                            <option>2005</option>
                            <option>2006</option>
                            <option>2007</option>
                            <option>2008</option>
                        </select>

                    </div>
                </div>

                <div class="registro-campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo"
                    placeholder="ejemplo@correo.com">
                </div>

                <div class="registro-campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena"
                    placeholder="Crea una contraseña">
                </div>

                <div class="registro-campo">
                    <label for="telefono">Número telefónico</label>
                    <input type="tel" id="telefono"
                    placeholder="Ingresa tu número">
                </div>

                <button type="button" class="btn-crear-cuenta">
                    Crear cuenta
                </button>

                <p class="registro-login">
                    ¿Ya tienes una cuenta?
                    <a href="index.html">Inicia sesión</a>
                </p>

            </form>

        </section>

        <footer class="registro-footer">
            © 2026 Banco de Tiempo y Talento
        </footer>

    </main>

</body>
</html>
