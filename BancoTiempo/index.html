<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Tiempo y Talento | Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="login-container">

        <!-- LOGOTIPO -->
        <section class="logo-container">

            <div class="logo-icon">
                ⌛
            </div>

            <h1>Banco de Tiempo</h1>
            <h2>Y TALENTO</h2>

            <p class="frase">
                Compartiendo habilidades, construyendo comunidad.
            </p>

        </section>

        <!-- FORMULARIO -->
        <section class="login-card">

            <h2>¡Bienvenido!</h2>

            <p class="subtitulo">
                Ingresa tus datos para continuar
            </p>

            <form>

                <div class="campo">
                    <label for="usuario">Nombre de usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresa tu usuario"
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                    >
                </div>

                <div class="opciones">

                    <label class="recordar">
                        <input type="checkbox">
                        Recuérdame
                    </label>

                    <span class="recuperar">
                        ¿Olvidaste tu contraseña?
                    </span>

                </div>

                <button type="button" class="btn-login">
                    Iniciar sesión
                </button>

            </form>

            <div class="separador">
                <span>¿Aún no tienes una cuenta?</span>
            </div>

            <a href="registro.html" class="btn-registro">
                Crear una cuenta
            </a>

        </section>

        <!-- PIE DE PAGINA -->
        <footer class="login-footer">
            © 2026 Banco de Tiempo y Talento
            <br>
            Todos los derechos reservados.
        </footer>

    </main>

</body>
</html>
